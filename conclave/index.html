<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITSoM Business Conclave 2027 | Events | BITS School of Management</title>
  <meta name="description" content="The BITSoM Business Conclave, the flagship forum of BITS School of Management, Mumbai. Conclave 2027 is coming: speak, partner, and see the past editions.">
  <meta property="og:title" content="BITSoM Business Conclave 2027">
  <meta property="og:description" content="31 industry leaders from 29 organisations have taken the Conclave stage. Be part of the 2027 edition.">
  <meta property="og:image" content="assets/img/brand/conclave-logo-light.png">
  <meta name="theme-color" content="#252A60">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/conclave.css">
</head>
<body>

  <!--
    SITE HEADER STUB.
    On bitsom.edu.in, replace this <header> with the site's global header.
    Everything inside <main> is the Conclave page itself.
  -->
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__brand" href="/" aria-label="BITS School of Management home">
        <img src="assets/img/brand/bitsom-logo-registered.png" alt="BITSoM®, BITS School of Management" width="358" height="560">
      </a>
      <nav class="site-header__nav" aria-label="Main">
        <a href="/">About</a>
        <a href="/">Programmes</a>
        <a href="/">Faculty</a>
        <a href="/">Admissions</a>
        <a href="/">Careers</a>
        <a href="/" aria-current="page">Events</a>
      </nav>
    </div>
  </header>

  <main id="conclave" class="conclave" aria-live="polite">
    <!-- Rendered by assets/js/conclave.js from data/editions.js -->
    <noscript>
      <div class="wrap noscript">Please enable JavaScript to view the BITSoM Business Conclave page.</div>
    </noscript>
  </main>

  <!-- SITE FOOTER STUB: replace with the global footer on bitsom.edu.in -->
  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <div class="site-footer__brand">
        <img src="assets/img/brand/bitsom-logo-registered.png" alt="BITSoM®" width="358" height="560">
        <div>
          <strong>BITS School of Management</strong>
          <span>A global business school under the aegis of BITS Pilani · Mumbai</span>
        </div>
      </div>
      <p class="site-footer__meta">© <span data-year></span> BITSoM. All rights reserved.</p>
    </div>
  </footer>

  <!-- Photo viewer for the galleries -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lightbox__close" type="button" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photo">‹</button>
    <figure class="lightbox__figure">
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photo">›</button>
  </dialog>

  <script src="data/editions.js"></script>
  <script src="assets/js/conclave.js"></script>
</body>
</html>
